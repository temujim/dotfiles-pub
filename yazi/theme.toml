# Yazi theme.toml — flavor selection
# ---------------------------------------------------------
# Themes are bundled as "flavors" in ./flavors/ (34 total, including the
# custom `allwhite` flavor). Set the active theme by name on the dark/light
# lines below (folder name without the `.yazi` suffix).
#
# Prioritized default: `allwhite` — every file & directory name renders in
# bright white for maximum readability. To use any other bundled flavor,
# change dark/light to e.g. "dracula", "tokyo-night", "kanagawa", "nord",
# "catppuccin-mocha", etc.  (see ./flavors/ for the full list)
#
# keymap.toml is NOT touched by theming: the `!` shell-in-CWD binding and
# all other ranger-style keybindings live there and remain active.
# ---------------------------------------------------------

[flavor]
dark  = "allwhite"
light = "allwhite"
