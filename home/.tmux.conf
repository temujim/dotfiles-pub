# >>> tmux restore after reboot (ported from profile-b) >>>
# Restore sessions/windows/panes/layouts after tmux or computer restarts.
# Manual save:    Prefix (C-a) + Ctrl-s
# Manual restore: Prefix (C-a) + Ctrl-r
set -g @resurrect-capture-pane-contents 'on'

# Custom save strategy: recursively inspect each pane process tree and save
# Hermes/Claude agent panes as concrete resumable commands, e.g.
#   hermes --resume <session_id>
#   hermes --profile <name> --resume <session_id>
#   claude --resume <uuid>
# This handles Python-wrapped/profile Hermes and Claude nested under shells.
set -g @resurrect-save-command-strategy 'hermes_agents'

# Restore ssh and normalized agent resume commands; avoid ':all:' so arbitrary
# old commands are not relaunched after reboot.
set -g @resurrect-processes 'ssh "~hermes --resume" "~hermes --profile" "~claude --resume" "~claude"'

# After restore, ask restored Hermes panes to show /history when possible.
set -g @resurrect-hook-post-restore-all 'tmux run-shell -b "$HOME/.tmux/plugins/tmux-resurrect/scripts/hermes_history_after_restore.sh"'

# Save Terminal.app window geometry alongside each tmux-resurrect save.
set -g @resurrect-hook-post-save-all 'tmux run-shell -b "$HOME/.tmux/scripts/save_terminal_geometry.sh >/dev/null 2>>$HOME/.local/share/tmux/resurrect/terminal_geometry.log"'

# Auto-save every 15 minutes and auto-restore when the tmux server starts.
set -g @continuum-save-interval '15'
set -g @continuum-restore 'on'

# macOS: start tmux on login/reboot via tmux-continuum's LaunchAgent.
set -g @continuum-boot 'on'
# <<< tmux restore after reboot <<<

# >>> Thicker/bolder pane borders (added 2026-07-30) >>>
# Maximum weight tmux can draw on pane separators: heavy box-drawing glyphs +
# bold attribute (Terminal.app renders bold line glyphs with thicker strokes).
# Colors unchanged from the tmuxline scheme -- ONLY line weight is touched.
# Rollback: bash ~/tmux-border-rollback.sh  (restores ~/.tmux.conf.bak-20260730)
# Line options: single | double | heavy | simple | number
# (no custom characters possible; "double" ═ is the closest to a "====" look)
set -g pane-border-lines double
set -g pane-border-style "fg=colour236,bold"
set -g pane-active-border-style "fg=colour148,bold"
# <<< Thicker/bolder pane borders <<<

# TPM must stay last so tmux-continuum can hook status-right after themes.
run '~/.tmux/plugins/tpm/tpm'

