# copy paste vim in tmux
bind P paste-buffer

## System clipboard integration (macOS)
# Copy-mode selections go to the macOS clipboard so Cmd-v works in browsers/apps.
# Prefix is C-a in this config, so usage is: C-a [ -> Space to select -> Enter or y to copy.
# Mouse drag release in copy mode also copies the selection to the system clipboard.
set -g set-clipboard on
set -g allow-passthrough on
set -as terminal-features ',screen*:clipboard,tmux*:clipboard'
set -g copy-command "pbcopy"
setw -g mode-keys vi
bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "pbcopy"
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"


